services:
  postgres:
    image: postgres:18-alpine
    container_name: zythologue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zythologue}
      POSTGRES_USER: ${POSTGRES_USER:-zythologue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zythologue}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres18_cluster:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zythologue} -d ${POSTGRES_DB:-zythologue}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: zythologue-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-zythologue}:${POSTGRES_PASSWORD:-zythologue}@postgres:5432/${POSTGRES_DB:-zythologue}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres18_cluster:
